<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>{{file_name}} | Fast Stream</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
    :root {
        --bg-color: #0d0d0d;
        --card-bg: #1a1a1a;
        --text-color: #ffffff;
        --accent-vlc: #ff5722;
        --accent-mx: #2196f3;
        --accent-dl: #27ae60; /* ডাউনলোডের জন্য সবুজ */
        --accent-tg: #0088cc;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        margin: 0;
        padding: 10px;
        display: flex;
        justify-content: center;
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 600px;
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    /* শিরোনাম */
    h2 {
        font-size: 18px;
        font-weight: 600;
        margin: 5px 0;
        color: #e0e0e0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 5px;
    }
    
    /* ভিডিও প্লেয়ার বক্স */
    .video-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        overflow: hidden;
        border: 1px solid #333;
    }
    
    video {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    /* লোডার এনিমেশন */
    #loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top: 4px solid var(--accent-mx);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: none;
        pointer-events: none;
        z-index: 10;
    }

    @keyframes spin { 
        0% { transform: translate(-50%, -50%) rotate(0deg); } 
        100% { transform: translate(-50%, -50%) rotate(360deg); } 
    }
    
    /* বাটন ডিজাইন */
    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px;
        border-radius: 8px;
        text-decoration: none;
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        border: none;
        transition: transform 0.2s, opacity 0.2s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .btn:active { transform: scale(0.96); }
    .btn:hover { opacity: 0.9; }

    /* কালার ক্লাস */
    .vlc { background: var(--accent-vlc); }
    .mx { background: var(--accent-mx); }
    .download { 
        background: var(--accent-dl); 
        grid-column: span 2; /* পুরো জায়গা নিবে */
        font-size: 16px;
    }
    .tg { 
        background: var(--accent-tg); 
        width: 100%;
        box-sizing: border-box;
        margin-top: 5px;
    }
    
    /* আইকন ফিক্স */
    .btn i { margin-right: 8px; font-style: normal; }

    /* বিজ্ঞাপনের জায়গা */
    .ad-box { 
        width: 100%;
        background: transparent;
        border-radius: 8px; 
        min-height: 50px; 
        display: flex; 
        justify-content: center; 
        align-items: center;
        overflow: hidden;
    }
    
    .footer {
        font-size: 12px;
        color: #666;
        margin-top: 20px;
        text-align: center;
        padding-bottom: 20px;
    }
</style>
</head>
<body>

<div class="container">
    <h2>{{file_name}}</h2>

    <!-- বিজ্ঞাপন ১ (উপরে) -->
    <div class="ad-box">
        <script type="text/javascript" src="//pl27974267.effectivegatecpm.com/72/92/c4/7292c40715a3a7347cbc4f26df859499.js"></script>
    </div>

    <!-- ভিডিও প্লেয়ার -->
    <div class="video-wrapper">
        <div id="loader"></div>
        <video id="video" controls playsinline poster="{{file_thumb}}"></video>
    </div>

    <!-- কন্ট্রোল বাটন এরিয়া -->
    <div class="btn-grid">
        <!-- প্লেয়ার বাটন -->
        <a href="intent:{{file_url}}#Intent;package=org.videolan.vlc;type=video/*;end" class="btn vlc">
            <i>🚀</i> VLC Player
        </a>
        <a href="intent:{{file_url}}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end" class="btn mx">
            <i>⚡</i> MX Player
        </a>

        <!-- নতুন ডাউনলোড বাটন -->
        <a href="{{file_url}}" class="btn download" download target="_blank">
            <i>📥</i> Download Video
        </a>
    </div>

    <!-- টেলিগ্রাম বাটন -->
    <a href="https://t.me/+J4SmKjWRDqpjY2Nl" class="btn tg">
        <i>📢</i> Join Main Channel
    </a>

    <!-- বিজ্ঞাপন ২ (নিচে) -->
    <div class="ad-box">
        <script type="text/javascript" src="//pl27974267.effectivegatecpm.com/72/92/c4/7292c40715a3a7347cbc4f26df859499.js"></script>
    </div>

    <div class="footer">Powered by AV Botz</div>
</div>

<!-- পপ-আন্ডার বিজ্ঞাপন -->
<script type="text/javascript" src="//pl27974255.effectivegatecpm.com/fb/97/40/fb9740bececcc7766d98eaa666b7f399.js"></script>

<!-- HLS Script -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>

<script>
    // --- ভিডিও প্লেয়ার লজিক ---
    var video = document.getElementById('video');
    var videoSrc = "{{file_url}}";
    var loader = document.getElementById('loader');

    function showLoader() { loader.style.display = 'block'; }
    function hideLoader() { loader.style.display = 'none'; }

    video.addEventListener('waiting', showLoader);
    video.addEventListener('playing', hideLoader);
    video.addEventListener('canplay', hideLoader);
    
    // লোডিং শুরু
    showLoader();

    if (Hls.isSupported() && videoSrc.includes('.m3u8')) {
        var hls = new Hls({
            autoStartLoad: true,
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
        });
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, hideLoader);
        hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
                showLoader(); // এরর হলে লোডার দেখাবে বা এরর মেসেজ হ্যান্ডেল করা যাবে
            }
        });
    } else {
        video.src = videoSrc;
        video.addEventListener('loadedmetadata', hideLoader);
    }
</script>

</body>
</html>
