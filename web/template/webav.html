<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>{{file_name}} | Fast Stream</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
    body {
        background-color: #0d0d0d;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 10px;
        text-align: center;
    }
    .container { max-width: 600px; margin: auto; position: relative; }
    h2 { font-size: 16px; margin: 10px 0; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* ভিডিও প্লেয়ার কন্টেইনার */
    .video-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        overflow: hidden;
    }
    
    video { width: 100%; height: 100%; object-fit: contain; }

    /* কাস্টম লোডার */
    #loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        display: none; /* ডিফল্ট হাইড থাকবে */
        z-index: 10;
        pointer-events: none;
    }

    @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    
    /* বাটন */
    .btn-container { display: flex; gap: 10px; margin-top: 15px; }
    .btn { flex: 1; padding: 12px; border-radius: 5px; text-decoration: none; color: #fff; font-weight: bold; font-size: 14px; border: none; transition: 0.2s; }
    .btn:active { transform: scale(0.98); }
    .vlc { background: #ff5722; }
    .mx { background: #2196f3; }
    .tg { background: #0088cc; display: block; margin-top: 10px; width: 100%; box-sizing: border-box; }
    
    .ad-box { margin: 15px 0; padding: 5px; background: #1a1a1a; border-radius: 5px; min-height: 50px; }
    .footer { font-size: 10px; color: #444; margin-top: 20px; }
</style>
</head>
<body>

<div class="container">
    <h2>{{file_name}}</h2>

    <!-- বিজ্ঞাপন ১ -->
    <div class="ad-box">
        <script type="text/javascript" src="//pl27974267.effectivegatecpm.com/72/92/c4/7292c40715a3a7347cbc4f26df859499.js"></script>
    </div>

    <!-- ভিডিও প্লেয়ার সেকশন -->
    <div class="video-wrapper">
        <div id="loader"></div>
        <video id="video" controls playsinline poster="{{file_thumb}}"></video>
    </div>

    <!-- বাটন -->
    <div class="btn-container">
        <a href="intent:{{file_url}}#Intent;package=org.videolan.vlc;type=video/*;end" class="btn vlc">🚀 VLC Player</a>
        <a href="intent:{{file_url}}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end" class="btn mx">⚡ MX Player</a>
    </div>

    <a href="https://t.me/+J4SmKjWRDqpjY2Nl" class="btn tg">📢 Join Main Channel</a>

    <!-- বিজ্ঞাপন ২ -->
    <div class="ad-box">
        <script type="text/javascript" src="//pl27974267.effectivegatecpm.com/72/92/c4/7292c40715a3a7347cbc4f26df859499.js"></script>
    </div>

    <div class="footer">Powered by AV Botz</div>
</div>

<script type="text/javascript" src="//pl27974255.effectivegatecpm.com/fb/97/40/fb9740bececcc7766d98eaa666b7f399.js"></script>

<!-- HLS Script -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
<script>
    var video = document.getElementById('video');
    var videoSrc = "{{file_url}}";
    var loader = document.getElementById('loader');

    // লোডার দেখানোর ফাংশন
    function showLoader() { loader.style.display = 'block'; }
    function hideLoader() { loader.style.display = 'none'; }

    video.addEventListener('waiting', showLoader);
    video.addEventListener('playing', hideLoader);
    video.addEventListener('canplay', hideLoader);

    if (Hls.isSupported() && videoSrc.includes('.m3u8')) {
        var config = {
            debug: false,
            autoStartLoad: true,
            startLevel: -1,
            // বাফার অপ্টিমাইজেশন (গুরুত্বপূর্ণ পরিবর্তন)
            maxBufferLength: 30, 
            maxMaxBufferLength: 60, // মেমোরি কম খাওয়ার জন্য কমানো হলো
            maxBufferHole: 0.5,
            
            // নেটওয়ার্ক রিকভারি অপশন
            manifestLoadingTimeOut: 10000,
            manifestLoadingMaxRetry: 3,
            levelLoadingTimeOut: 10000,
            levelLoadingMaxRetry: 3,
            fragLoadingTimeOut: 20000,
            fragLoadingMaxRetry: 3,
            
            // ভিডিও আটকে গেলে স্কিপ করার জন্য
            nudgeOffset: 0.1,
            nudgeMaxRetry: 5,
        };

        var hls = new Hls(config);
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            // সাউন্ড মিউট করে অটো প্লে (ব্রাউজার পলিসি মানার জন্য)
            // video.muted = true; 
            // video.play().catch(e => console.log("Auto-play blocked"));
        });

        // এরর হ্যান্ডলিং এবং অটো-রিকভারি
        hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
                switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                    console.log("Network error, trying to recover...");
                    hls.startLoad();
                    break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                    console.log("Media error, trying to recover...");
                    hls.recoverMediaError();
                    break;
                default:
                    console.log("Fatal error, destroying player.");
                    hls.destroy();
                    break;
                }
            }
        });

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // iOS বা Safari এর জন্য
        video.src = videoSrc;
        video.addEventListener('loadedmetadata', function() {
             // video.play();
        });
    } else {
        // সাধারণ ভিডিও ফাইল (.mp4)
        video.src = videoSrc;
    }
</script>

</body>
</html>
