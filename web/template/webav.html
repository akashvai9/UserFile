<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>{{file_name}} | Fast Stream</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
    :root {
        --bg-color: #0f0f0f;
        --text-color: #ffffff;
        --vlc-color: #ff5722;
        --mx-color: #2196f3;
        --dl-color: #27ae60;      /* সাধারণ ডাউনলোডের জন্য সবুজ */
        --idm-color: #8e44ad;     /* 1DM এর জন্য বেগুনি */
        --adm-color: #009688;     /* ADM এর জন্য টিল কালার */
        --tg-color: #0088cc;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 10px;
        display: flex;
        justify-content: center;
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 600px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    /* শিরোনাম */
    h2 {
        font-size: 16px;
        color: #ccc;
        margin: 5px 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
    }
    
    /* ভিডিও প্লেয়ার */
    .video-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        overflow: hidden;
        border: 1px solid #333;
    }
    
    video { width: 100%; height: 100%; object-fit: contain; }

    /* লোডার */
    #loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 4px solid rgba(255,255,255,0.1);
        border-top: 4px solid var(--mx-color);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 0.8s linear infinite;
        display: none;
        pointer-events: none;
        z-index: 10;
    }
    @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    
    /* বাটন গ্রিড ডিজাইন */
    .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr; /* দুই কলাম */
        gap: 10px;
        margin-top: 5px;
    }

    .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        border-radius: 6px;
        text-decoration: none;
        color: #fff;
        font-weight: bold;
        font-size: 14px;
        border: none;
        transition: 0.2s;
        box-shadow: 0 3px 5px rgba(0,0,0,0.3);
        background: #333;
    }

    .btn:active { transform: scale(0.97); }
    .btn i { margin-right: 6px; font-style: normal; font-size: 16px; }

    /* বাটন কালার */
    .vlc { background: var(--vlc-color); }
    .mx { background: var(--mx-color); }
    
    /* ডাউনলোড বাটন (ফুল উইডথ) */
    .download-main {
        background: var(--dl-color);
        grid-column: span 2; /* পুরো জায়গা জুড়ে থাকবে */
        font-size: 16px;
        padding: 14px;
        animation: pulse 2s infinite;
    }

    /* অ্যাপ দিয়ে ডাউনলোড */
    .idm { background: var(--idm-color); }
    .adm { background: var(--adm-color); }

    .tg { 
        background: var(--tg-color); 
        width: 100%; 
        display: block; 
        text-align: center; 
        box-sizing: border-box; 
        margin-top: 5px;
    }

    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(39, 174, 96, 0); }
        100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
    }
    
    /* বিজ্ঞাপন বক্স */
    .ad-box { 
        width: 100%;
        background: transparent;
        border-radius: 5px; 
        min-height: 50px; 
        display: flex; 
        justify-content: center; 
        align-items: center;
        overflow: hidden;
        margin: 5px 0;
    }
    
    .footer { font-size: 11px; color: #555; margin-top: 20px; text-align: center; }
</style>
</head>
<body>

<div class="container">
    <h2>{{file_name}}</h2>

    <!-- বিজ্ঞাপন ১ -->
    <div class="ad-box">
        <script type="text/javascript" src="//pl27974267.effectivegatecpm.com/72/92/c4/7292c40715a3a7347cbc4f26df859499.js"></script>
    </div>

    <!-- ভিডিও প্লেয়ার -->
    <div class="video-wrapper">
        <div id="loader"></div>
        <video id="video" controls playsinline poster="{{file_thumb}}"></video>
    </div>

    <!-- বাটন এরিয়া -->
    <div class="btn-grid">
        <!-- অনলাইন প্লে -->
        <a href="intent:{{file_url}}#Intent;package=org.videolan.vlc;type=video/*;end" class="btn vlc">
            <i>🚀</i> VLC Player
        </a>
        <a href="intent:{{file_url}}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end" class="btn mx">
            <i>⚡</i> MX Player
        </a>

        <!-- সরাসরি ডাউনলোড -->
        <a href="{{file_url}}" class="btn download-main" target="_blank" download>
            <i>📥</i> Download Video
        </a>

        <!-- দ্রুত ডাউনলোডের জন্য অ্যাপ -->
        <a href="intent:{{file_url}}#Intent;package=idm.internet.download.manager;type=video/*;end" class="btn idm">
            <i>🔥</i> 1DM App
        </a>
        <a href="intent:{{file_url}}#Intent;package=com.dv.adm;type=video/*;end" class="btn adm">
            <i>🤖</i> ADM App
        </a>
    </div>

    <!-- টেলিগ্রাম চ্যানেল -->
    <a href="https://t.me/+J4SmKjWRDqpjY2Nl" class="btn tg">📢 Join Main Channel</a>

    <!-- বিজ্ঞাপন ২ -->
    <div class="ad-box">
        <script type="text/javascript" src="//pl27974267.effectivegatecpm.com/72/92/c4/7292c40715a3a7347cbc4f26df859499.js"></script>
    </div>

    <div class="footer">Powered by AV Botz</div>
</div>

<!-- পপ-আন্ডার -->
<script type="text/javascript" src="//pl27974255.effectivegatecpm.com/fb/97/40/fb9740bececcc7766d98eaa666b7f399.js"></script>

<!-- HLS Script -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>

<script>
    var video = document.getElementById('video');
    var videoSrc = "{{file_url}}";
    var loader = document.getElementById('loader');

    function showLoader() { loader.style.display = 'block'; }
    function hideLoader() { loader.style.display = 'none'; }

    video.addEventListener('waiting', showLoader);
    video.addEventListener('playing', hideLoader);
    video.addEventListener('canplay', hideLoader);
    showLoader();

    if (Hls.isSupported() && videoSrc.includes('.m3u8')) {
        var hls = new Hls({
            autoStartLoad: true,
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
        });
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, hideLoader);
    } else {
        video.src = videoSrc;
        video.addEventListener('loadedmetadata', hideLoader);
    }
</script>

</body>
</html>
