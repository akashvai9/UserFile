<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{file_name}} | Fast Stream</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Plyr CSS -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

<style>
:root {
  --primary-color: #00ffe5;
  --bg-color: #0d0d0d;
  --card-bg: #1a1a1a;
}

body {
  background-color: var(--bg-color);
  color: #fff;
  font-family: 'Poppins', sans-serif;
  margin: 0;
  padding: 0;
}

.container { max-width: 800px; margin: auto; padding: 15px; }
h2 { font-size: 18px; text-align: center; margin-bottom: 15px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.video-wrapper { border-radius: 12px; overflow: hidden; border: 1px solid #333; box-shadow: 0 4px 20px rgba(0, 255, 229, 0.1); background: #000; aspect-ratio: 16/9; }

.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
.btn { display: block; width: 100%; padding: 12px; text-align: center; font-weight: 600; border-radius: 8px; text-decoration: none; font-size: 14px; transition: 0.2s; border: none; cursor: pointer; }
.btn:active { transform: scale(0.96); }
.btn-vlc { background: #ff5722; color: white; }
.btn-mx { background: #2196f3; color: white; }
.btn-telegram { background: linear-gradient(45deg, #0088cc, #00bfff); color: white; margin-top: 10px; box-shadow: 0 4px 10px rgba(0, 136, 204, 0.3); }

.ad-box { min-height: 50px; padding: 5px; border-radius: 8px; margin: 15px 0; text-align: center; border: 1px dashed #333; background: var(--card-bg); }
.footer { text-align: center; margin-top: 30px; font-size: 11px; color: #555; }

:root { --plyr-color-main: var(--primary-color); }
</style>
</head>
<body>

<div class="container">
  <h2>{{file_name}}</h2>

  <!-- Top Ad -->
  <div class="ad-box">
    <p style="color:#555; font-size:10px;">Advertisement</p>
    <script type="text/javascript" src="//pl27974267.effectivegatecpm.com/72/92/c4/7292c40715a3a7347cbc4f26df859499.js"></script>
  </div>

  <!-- Video Player -->
  <div class="video-wrapper">
    <video id="player" controls playsinline preload="auto"></video>
  </div>

  <!-- VLC & MX Player -->
  <div style="text-align:center; margin-top:15px;">
    <p style="font-size:12px; color:#aaa; margin-bottom:5px;">⚠️ Video buffering? Play in App:</p>
    <div class="btn-grid">
        <a href="intent:{{file_url}}#Intent;package=org.videolan.vlc;type=video/*;end" class="btn btn-vlc">🚀 Play in VLC</a>
        <a href="intent:{{file_url}}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end" class="btn btn-mx">⚡ Play in MX</a>
    </div>
  </div>

  <!-- Telegram Buttons -->
  <a href="https://t.me/+J4SmKjWRDqpjY2Nl" class="btn btn-telegram">📢 Join Main Channel</a>
  <a href="https://t.me/+J4SmKjWRDqpjY2Nl" class="btn btn-telegram">🔔 Join Updates Channel</a>

  <!-- Middle & Footer Ads -->
  <div class="ad-box">
    <script type="text/javascript" src="//pl27974267.effectivegatecpm.com/72/92/c4/7292c40715a3a7347cbc4f26df859499.js"></script>
  </div>
  <div class="ad-box">
    <script type="text/javascript" src="//pl27974267.effectivegatecpm.com/72/92/c4/7292c40715a3a7347cbc4f26df859499.js"></script>
  </div>

  <div class="footer">Powered by AV Botz</div>
</div>

<!-- Plyr + HLS.js -->
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
<script>
const video = document.getElementById('player');
const source = "{{file_url}}";

// Detect format
if(Hls.isSupported() && source.endsWith('.m3u8')) {
    // HLS streaming
    const hls = new Hls();
    hls.loadSource(source);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,function() { video.play(); });
} else {
    // Direct play for MP4/WEBM/AVI etc.
    video.src = source;
}

// Initialize Plyr
const player = new Plyr('#player', {
    controls: ['play-large','play','progress','current-time','mute','volume','fullscreen'],
    speed: { selected:1, options:[0.5,0.75,1,1.25,1.5,2] }
});
</script>

</body>
</html>
