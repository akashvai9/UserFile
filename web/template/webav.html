<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<title>{{file_name}} | Fast Stream</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
    :root {
        --bg-color: #080a0f;
        --card-bg: rgba(28, 28, 35, 0.8);
        --text-color: #f0f0f0;
        --accent-color: #00d2ff;
        --btn-vlc: linear-gradient(135deg, #FF8C00, #e67e22);
        --btn-mx: linear-gradient(135deg, #00c6ff, #0072ff);
        --btn-dl: linear-gradient(135deg, #2ecc71, #27ae60);
        --btn-tg: linear-gradient(135deg, #3498db, #2980b9);
        --glass-border: rgba(255, 255, 255, 0.1);
    }

    body {
        background-color: var(--bg-color);
        background-image: radial-gradient(circle at top right, #1a1e2e, #080a0f);
        color: var(--text-color);
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 15px;
        display: flex;
        justify-content: center;
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 550px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h2 {
        font-size: 18px;
        font-weight: 600;
        color: #fff;
        margin: 10px 0;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    
    /* প্রিমিয়াম ভিডিও প্লেয়ার */
    .video-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        overflow: hidden;
        border: 1px solid var(--glass-border);
    }
    
    video { width: 100%; height: 100%; object-fit: contain; }

    /* মডার্ন লোডার */
    #loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50px;
        height: 50px;
        border: 3px solid rgba(0, 210, 255, 0.1);
        border-top: 3px solid var(--accent-color);
        border-radius: 50%;
        animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        display: none;
        z-index: 10;
    }
    @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    
    /* বাটন স্টাইল */
    .btn-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .player-row {
        display: flex;
        gap: 12px;
    }

    .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 15px;
        border-radius: 12px;
        text-decoration: none;
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        border: 1px solid rgba(255,255,255,0.05);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        position: relative;
        overflow: hidden;
    }
    
    .btn::after {
        content: '';
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: 0.5s;
    }

    .btn:hover::after { left: 100%; }

    .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        filter: brightness(1.1);
    }

    .btn:active { transform: translateY(0); }
    .btn i { margin-right: 10px; font-style: normal; font-size: 20px; }

    /* আলাদা আলাদা কালার */
    .vlc { background: var(--btn-vlc); flex: 1; }
    .mx { background: var(--btn-mx); flex: 1; }
    
    .download-btn {
        background: var(--btn-dl);
        width: 100%;
        font-size: 16px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-top: 5px;
    }
    
    .tg { 
        background: var(--btn-tg); 
        width: 100%; 
        font-size: 14px;
        opacity: 0.9;
    }

    /* বিজ্ঞাপন বক্স */
    .ad-box { 
        width: 100%;
        background: rgba(255,255,255,0.03);
        border-radius: 12px; 
        min-height: 60px; 
        display: flex; 
        justify-content: center; 
        align-items: center;
        overflow: hidden;
        border: 1px dashed var(--glass-border);
    }
    
    .footer { 
        font-size: 12px; 
        color: #666; 
        margin-top: 20px; 
        text-align: center; 
        letter-spacing: 1px;
    }

    /* মোবাইল অপ্টিমাইজেশন */
    @media (max-width: 400px) {
        .btn { padding: 12px; font-size: 14px; }
        h2 { font-size: 15px; }
    }
</style>
</head>

<!-- HLS Script -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>

<script>
    var video = document.getElementById('video');
    var videoSrc = "{{file_url}}";
    var loader = document.getElementById('loader');

    function showLoader() { loader.style.display = 'block'; }
    function hideLoader() { loader.style.display = 'none'; }

    video.addEventListener('waiting', showLoader);
    video.addEventListener('playing', hideLoader);
    video.addEventListener('canplay', hideLoader);
    showLoader();

    if (Hls.isSupported() && videoSrc.includes('.m3u8')) {
        var hls = new Hls({
            autoStartLoad: true,
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
        });
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, hideLoader);
    } else {
        video.src = videoSrc;
        video.addEventListener('loadedmetadata', hideLoader);
    }
</script>
