<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>{{file_name}} | Fast Stream</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Plyr CSS -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

<style>
/* --- কালার ভেরিয়েবল --- */
:root {
  --primary-color: #00ffe5;
  --bg-color: #0d0d0d;
  --card-bg: #1a1a1a;
}

body {
  background-color: var(--bg-color);
  color: #fff;
  font-family: 'Poppins', sans-serif;
  margin: 0;
  padding: 0;
}

.container { max-width: 800px; margin: auto; padding: 15px; }

h2 {
    font-size: 18px;
    text-align: center;
    white-space: nowrap; 
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 15px;
    color: #ddd;
}

/* ভিডিও প্লেয়ার ডিজাইন */
.video-wrapper { 
  border-radius: 12px; 
  overflow: hidden; 
  border: 1px solid #333;
  box-shadow: 0 4px 20px rgba(0, 255, 229, 0.1);
  background: #000;
  aspect-ratio: 16/9;
}

/* বাটন ডিজাইন */
.btn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.btn { 
  display: block; 
  width: 100%; 
  padding: 12px; 
  text-align: center; 
  font-weight: 600; 
  border-radius: 8px; 
  text-decoration: none; 
  font-size: 14px;
  transition: 0.2s;
  border: none;
  cursor: pointer;
}
.btn:active { transform: scale(0.96); }

/* স্পেশাল অ্যাপ বাটন (For Slow Internet) */
.btn-vlc { background: #ff5722; color: white; }
.btn-mx { background: #2196f3; color: white; }

/* চ্যানেল বাটন */
.btn-telegram { 
    background: linear-gradient(45deg, #0088cc, #00bfff); 
    color: white; 
    margin-top: 10px;
    box-shadow: 0 4px 10px rgba(0, 136, 204, 0.3);
}

/* অ্যাড বক্স */
.ad-box { 
  min-height: 50px;
  padding: 5px; 
  border-radius: 8px; 
  margin: 15px 0; 
  text-align: center; 
  border: 1px dashed #333; 
  background: var(--card-bg); 
}

.footer { text-align: center; margin-top: 30px; font-size: 11px; color: #555; }

/* Plyr কাস্টমাইজেশন */
:root { --plyr-color-main: var(--primary-color); }
</style>
</head>

<body>
<div class="container">

  <h2>{{file_name}}</h2>

  <!-- ১. উপরের বিজ্ঞাপন (TOP AD) -->
  <div class="ad-box">
    <p style="color:#555; font-size:10px;">Advertisement</p>
    <script type="text/javascript" src="//pl27974267.effectivegatecpm.com/72/92/c4/7292c40715a3a7347cbc4f26df859499.js"></script>
  </div>

  <!-- ভিডিও প্লেয়ার -->
  <div class="video-wrapper">
    <video id="player" controls playsinline preload="metadata">
        <source src="{{file_url}}" type="video/mp4" />
        <source src="{{file_url}}" type="video/x-matroska" />
    </video>
  </div>

  <!-- বাটন সেকশন (VLC & MX) -->
  <div style="text-align: center; margin-top: 15px;">
    <p style="font-size: 12px; color: #aaa; margin-bottom: 5px;">⚠️ Video buffering? Play in App:</p>
    <div class="btn-grid">
        <!-- VLC Player Link (Fixed for Android) -->
        <a href="intent:{{file_url}}#Intent;package=org.videolan.vlc;type=video/*;end" class="btn btn-vlc">🚀 Play in VLC</a>
        
        <!-- MX Player Link -->
        <a href="intent:{{file_url}}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end" class="btn btn-mx">⚡ Play in MX</a>
    </div>
  </div>

  <!-- টেলিগ্রাম বাটন -->
  <a href="https://t.me/+J4SmKjWRDqpjY2Nl" class="btn btn-telegram">📢 Join Main Channel</a>
  <a href="https://t.me/+J4SmKjWRDqpjY2Nl" class="btn btn-telegram">🔔 Join Updates Channel</a>

  <!-- ২. মাঝখানের বিজ্ঞাপন (MIDDLE AD) -->
  <div class="ad-box">
    <script type="text/javascript" src="//pl27974267.effectivegatecpm.com/72/92/c4/7292c40715a3a7347cbc4f26df859499.js"></script>
  </div>

  <!-- ৩. নিচের বিজ্ঞাপন (FOOTER AD - যুক্ত করা হয়েছে) -->
  <div class="ad-box">
    <script type="text/javascript" src="//pl27974267.effectivegatecpm.com/72/92/c4/7292c40715a3a7347cbc4f26df859499.js"></script>
  </div>

  <div class="footer">Powered by AV Botz</div>
</div>

<!-- ৪. পপ-আন্ডার বিজ্ঞাপন -->
<script type="text/javascript" src="//pl27974255.effectivegatecpm.com/fb/97/40/fb9740bececcc7766d98eaa666b7f399.js"></script>

<!-- Scripts -->
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script>
    const player = new Plyr('#player', {
        controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
        speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
    });
</script>

</body>
</html>
